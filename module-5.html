{
  title: "1. Objectifs de ce module",
  html: `
    <p>Tu connais deja les nombres trigonometriques d'un angle aigu (triangles rectangles) et d'un angle entre 0&deg; et 180&deg;. Ce dernier module de 5e etend ces notions a n'importe quel reel, via les <strong>fonctions trigonometriques</strong>, tres utiles pour modeliser des phenomenes periodiques (marees, sons, mouvements circulaires).</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>

{
  title: "2. Le radian : une autre unite pour les angles",
  html: `
    <p>Jusqu'ici, tu mesurais les angles en degres. Le <strong class="term" data-def="Le radian est une unite de mesure des angles : un tour complet mesure deux fois pi radians, ce qui correspond a 360 degres.">radian</strong> est une autre unite, plus naturelle en mathematiques, car elle relie directement un angle a la longueur d'arc qu'il decoupe sur un cercle.</p>
    <div class="callout formule">
      Un tour complet = 360&deg; = 2&pi; radians, donc 180&deg; = &pi; radians.
    </div>
    <table class="data">
      <tr><th>Degres</th><td>30&deg;</td><td>45&deg;</td><td>60&deg;</td><td>90&deg;</td><td>180&deg;</td><td>270&deg;</td></tr>
      <tr><th>Radians</th><td>&pi;/6</td><td>&pi;/4</td><td>&pi;/3</td><td>&pi;/2</td><td>&pi;</td><td>3&pi;/2</td></tr>
    </table>
    <p>Pour convertir : radians = degres &times; (&pi;/180), et degres = radians &times; (180/&pi;). Pour les angles qui ne sont pas des fractions usuelles de &pi;, on utilise la touche de conversion de la calculatrice.</p>
  `
},
{
  title: "3. Longueur d'arc et aire de secteur",
  html: `
    <p>Avec un angle exprime en radians, deux formules tres simples permettent de calculer une longueur d'arc et une aire de secteur circulaire.</p>
    <div class="callout formule">
      Longueur d'arc : L = r &times; &theta; (&theta; en radians)<br>
      Aire du secteur : A = (1/2) &times; r&sup2; &times; &theta;
    </div>
    <p><strong>Exemple :</strong> un secteur de rayon r = 5 cm et d'angle &theta; = &pi;/3 (soit 60&deg;).</p>
    <div class="callout formule">
      L = 5 &times; &pi;/3 &asymp; 5,24 cm<br>
      A = (1/2) &times; 25 &times; &pi;/3 &asymp; 13,09 cm&sup2;
    </div>
  `
},
{
  title: "4. Les fonctions trigonometriques de reference",
  html: `
    <p>Les fonctions x &rarr; sin(x), x &rarr; cos(x) et x &rarr; tan(x) associent a tout reel x (une mesure d'angle en radians) un nombre trigonometrique. Ce sont des fonctions <strong class="term" data-def="Une fonction periodique se repete identique a intervalles reguliers : la fonction sinus, par exemple, reprend exactement les memes valeurs tous les deux pi.">periodiques</strong>.</p>
    <table class="data">
      <tr><th>Fonction</th><th>Periode</th><th>Valeurs extremes</th></tr>
      <tr><td>x &rarr; sin(x)</td><td>2&pi;</td><td>entre -1 et 1</td></tr>
      <tr><td>x &rarr; cos(x)</td><td>2&pi;</td><td>entre -1 et 1</td></tr>
      <tr><td>x &rarr; tan(x)</td><td>&pi;</td><td>non bornee (non definie en &pi;/2 + k&pi;)</td></tr>
    </table>
    <div class="callout">
      Le graphique de x &rarr; sin(x) est une sinusoide : il monte de 0 a 1 (en &pi;/2), redescend a 0 (en &pi;), continue jusqu'a -1 (en 3&pi;/2), puis revient a 0 (en 2&pi;), et recommence a l'identique.
    </div>
  `
},
{
  title: "5. La fonction transformee x &rarr; a sin(bx + c)",
  html: `
    <p>En modifiant trois parametres, on transforme la sinusoide de base pour modeliser des situations concretes (mouvement harmonique, son, marees).</p>
    <div class="callout formule">
      x &rarr; a sin(bx + c) : <strong class="term" data-def="L'amplitude d'une fonction trigonometrique, c'est la valeur maximale qu'elle atteint par rapport a sa position moyenne : elle correspond au parametre a devant le sinus.">amplitude</strong> = |a| ; <strong class="term" data-def="La periode d'une fonction trigonometrique, c'est la plus petite distance sur l'axe des x apres laquelle la fonction reprend exactement les memes valeurs. Elle se calcule en divisant deux pi par le parametre b.">periode</strong> T = 2&pi;/|b| ; <strong class="term" data-def="Le dephasage d'une fonction trigonometrique, c'est le decalage horizontal de son graphique par rapport a la fonction sinus de base.">dephasage</strong> = -c/b
    </div>
    <p><strong>Exemple :</strong> f(x) = 3 sin(2x - &pi;/2).</p>
    <ul class="clean">
      <li>Amplitude : a = 3 (la fonction oscille entre -3 et 3).</li>
      <li>Periode : T = 2&pi;/2 = &pi; (elle se repete tous les &pi;).</li>
      <li>Dephasage : -c/b = -(-&pi;/2)/2 = &pi;/4 (le graphique de sin est decale de &pi;/4 vers la droite).</li>
    </ul>
    <p>On peut d'ailleurs reecrire f(x) = 3 sin(2(x - &pi;/4)), ce qui rend le dephasage plus visible directement dans l'ecriture.</p>
  `
},
{
  title: "6. Resoudre une equation trigonometrique simple",
  html: `
    <p>Pour resoudre sin(x) = a (avec -1 &le; a &le; 1), on utilise le cercle trigonometrique : il existe en general deux familles de solutions entre 0 et 2&pi;.</p>
    <div class="callout formule">
      Exemple : resoudre sin(x) = 0,5 sur [0&deg; ; 360&deg;[.<br>
      Solutions : x = 30&deg; ou x = 180&deg; - 30&deg; = 150&deg;.
    </div>
    <p>Cela s'explique par la symetrie du cercle trigonometrique : deux angles supplementaires (dont la somme fait 180&deg;) ont le meme sinus. Pour cos(x) = a, ce sont deux angles opposes (x et -x) qui ont le meme cosinus.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> une equation trigonometrique a en general une infinite de solutions (en ajoutant 360&deg; ou 2&pi; a chaque solution trouvee). Sauf indication contraire, on donne les solutions sur un seul tour, soit [0&deg; ; 360&deg;[ ou [0 ; 2&pi;[.
    </div>
    <p><strong>Tu as termine la theorie de ce module, et la theorie de toute la 5e annee.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];
