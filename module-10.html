const theorySlides = [
{
  title: "1. Objectifs de ce module",
  html: `
    <p>Ce dernier module du parcours etend a l'espace (3 dimensions) ce que tu connais deja de la geometrie analytique plane : reperer des points par des coordonnees, traduire des droites et des plans par des equations, et resoudre des problemes geometriques par le calcul.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>calculer avec des vecteurs de l'espace (addition, multiplication par un reel, distance) ;</li>

  `
},
{
  title: "2. Reperer un point et un vecteur dans l'espace",
  html: `
    <p>Dans un <strong class="term" data-def="Un repere orthonorme de l'espace, c'est un systeme de trois axes perpendiculaires entre eux (x, y et z), gradues avec la meme unite, qui permet de reperer tout point de l'espace par trois coordonnees.">repere orthonorme de l'espace</strong>, tout point est repere par trois coordonnees (x, y, z), et tout <strong class="term" data-def="Un vecteur de l'espace, c'est un objet mathematique defini par trois composantes, qui represente un deplacement dans l'espace : de la meme longueur et de la meme direction, peu importe ou il est place.">vecteur</strong> par trois composantes.</p>
    <div class="callout formule">
      Vecteur AB entre A(xA,yA,zA) et B(xB,yB,zB) : AB = (xB-xA, yB-yA, zB-zA)<br>
      Addition : (a,b,c) + (d,e,f) = (a+d, b+e, c+f)<br>
      Multiplication par un reel k : k &times; (a,b,c) = (ka, kb, kc)
    </div>
    <p><strong>Exemple :</strong> A(1,2,3) et B(4,6,3). Vecteur AB = (4-1, 6-2, 3-3) = (3, 4, 0).</p>
  `
},
{
  title: "3. Distance, alignement et coplanarite",
  html: `
    <p>La distance entre deux points se deduit du theoreme de Pythagore, applique deux fois (une fois dans un plan horizontal, une fois a la verticale) :</p>
    <div class="callout formule">
      Distance AB = &radic;[(xB-xA)&sup2; + (yB-yA)&sup2; + (zB-zA)&sup2;]
    </div>
    <p><strong>Exemple :</strong> avec AB = (3, 4, 0) trouve plus haut : distance = &radic;(9+16+0) = &radic;25 = 5.</p>
    <div class="callout formule">
      Trois points A, B, C sont <strong class="term" data-def="Trois points sont alignes quand le vecteur qui relie les deux premiers est un multiple du vecteur qui relie le premier au troisieme : ils sont alors situes sur une meme droite.">alignes</strong> si le vecteur AC est un multiple du vecteur AB (memes rapports sur les trois composantes).
    </div>
    <p><strong>Exemple :</strong> A(0,0,0), B(1,2,3), C(2,4,6). AB = (1,2,3) et AC = (2,4,6) = 2 &times; AB : les trois points sont alignes.</p>
    <p>De la meme facon, quatre points sont <strong class="term" data-def="Quatre points sont coplanaires quand ils appartiennent tous a un meme plan : le vecteur qui relie les deux premiers au quatrieme peut alors s'exprimer comme une combinaison des vecteurs vers le deuxieme et le troisieme point.">coplanaires</strong> si le vecteur vers le 4e point peut s'ecrire comme une combinaison des deux autres vecteurs.</p>
  `
},
{
  title: "4. Condition de perpendicularite de deux vecteurs",
  html: `
    <p>Deux vecteurs (a,b,c) et (d,e,f) de l'espace sont <strong class="term" data-def="Deux vecteurs sont perpendiculaires quand la somme des produits de leurs composantes une a une vaut zero : cette condition se deduit du theoreme de Pythagore applique au triangle qu'ils forment.">perpendiculaires</strong> si et seulement si :</p>
    <div class="callout formule">
      a &times; d + b &times; e + c &times; f = 0
    </div>
    <p>Cette condition se deduit de la relation de Pythagore, appliquee au triangle forme par les deux vecteurs et le vecteur qui les relie.</p>
    <p><strong>Exemple :</strong> u = (1, 2, 3) et w = (2, -1, 0). On calcule : 1&times;2 + 2&times;(-1) + 3&times;0 = 2 - 2 + 0 = 0. Les vecteurs u et w sont donc perpendiculaires.</p>
  `
},
{
  title: "5. Equations d'une droite et d'un plan",
  html: `
    <p>Une droite de l'espace est determinee par un point A et un vecteur directeur d. Un plan est determine par un point A et deux vecteurs directeurs non alignes (ou, plus simple, par un <strong class="term" data-def="Un vecteur normal a un plan, c'est un vecteur perpendiculaire a tous les vecteurs de ce plan : il determine directement l'orientation du plan et sert a ecrire son equation cartesienne.">vecteur normal</strong>).</p>
    <div class="callout formule">
      <strong>Droite</strong> par A(1,0,2) de direction d=(2,1,-1) :<br>
      Equations parametriques : x = 1+2t, y = t, z = 2-t
    </div>
    <div class="callout formule">
      <strong>Plan</strong> par A(1,1,1) de vecteur normal n=(1,2,-1) :<br>
      Equation cartesienne : 1(x-1) + 2(y-1) - 1(z-1) = 0, soit x + 2y - z = 2
    </div>
    <p><strong>Verification :</strong> le point A(1,1,1) verifie bien 1+2-1=2. Le point C(0 ; 1,5 ; 1) verifie aussi 0+3-1=2 : C appartient donc au meme plan.</p>
  `
},
{
  title: "6. Parallelisme et intersection",
  html: `
    <p>Pour comparer deux droites ou deux plans, on compare leurs vecteurs directeurs (pour des droites) ou leurs vecteurs normaux (pour des plans).</p>
    <div class="callout formule">
      Deux droites sont paralleles si leurs vecteurs directeurs sont proportionnels.<br>
      Deux plans sont paralleles si leurs vecteurs normaux sont proportionnels.
    </div>
    <p><strong>Exemple :</strong> le plan de normal (1,2,-1) et le plan de normal (2,4,-2) sont paralleles, car (2,4,-2) = 2 &times; (1,2,-1).</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> deux plans non paralleles se coupent toujours selon une droite (jamais en un seul point). Deux droites non paralleles, elles, peuvent soit se couper en un point, soit ne jamais se rencontrer sans etre paralleles (on dit qu'elles sont non coplanaires).
    </div>
    <p><strong>Tu as termine la theorie de ce module, et la theorie de toute la 6e annee.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];
