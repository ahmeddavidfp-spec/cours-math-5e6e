{
  title: "1. Objectifs de ce module",
  html: `
    <p>Tu connais deja la statistique a une variable (moyenne, mediane, ecart-type...). Ce module etudie la relation entre <strong>deux</strong> variables mesurees sur une meme population : par exemple, le nombre d'heures d'etude et la note obtenue a un examen.</p>

      <strong>A la fin de ce module, tu seras capable de :</strong>

      </ul>
    </div>
  `

{
  title: "2. Representer une serie statistique a deux variables",
  html: `
    <p>Quand on mesure deux caracteristiques (x et y) sur les memes individus, on peut representer chaque individu par un point de coordonnees (x, y) : c'est un <strong class="term" data-def="Un nuage de points, c'est la representation graphique de plusieurs individus places selon leurs coordonnees x et y.">nuage de points</strong>.</p>
    <table class="data">
      <caption>Exemple : heures d'etude (x) et note sur 100 (y) pour 6 eleves</caption>
      <tr><th>x (heures)</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>

    <p>Pour notre exemple : x&#772; = (1+2+3+4+5+6)/6 = 3,5 et y&#772; = (45+50+55+65+70+80)/6 &asymp; 60,83. Le point moyen G(3,5 ; 60,83) est le "centre de gravite" du nuage de points : toute droite d'ajustement passera par ce point (pour la methode des moindres carres) ou proche de lui.</p>
  `

{
  title: "3. Correlation et causalite",
  html: `
    <p>Observer que deux variables evoluent ensemble (correlation) ne prouve pas que l'une cause l'autre (causalite).</p>
    <div class="callout piege">
      <strong>Exemple classique :</strong> le nombre de glaces vendues et le nombre de noyades augmentent tous les deux en ete. Ils sont <strong>correles</strong> (lies statistiquement), mais manger une glace ne cause evidemment pas de noyade : les deux sont causes par un troisieme facteur, la chaleur estivale.
    </div>
    <div class="callout">
      <strong class="term" data-def="La correlation, c'est le fait que deux variables evoluent ensemble de maniere statistiquement liee, sans que l'une provoque forcement l'autre.">Correlation</strong> : deux variables evoluent ensemble de maniere statistiquement liee.<br>
      <strong class="term" data-def="La causalite, c'est le fait qu'une variable provoque directement le changement d'une autre.">Causalite</strong> : une variable provoque directement le changement de l'autre.
    </div>
    <p>Dans notre exemple (heures d'etude / note), une causalite est plausible : etudier davantage peut raisonnablement ameliorer la note. Mais meme dans ce cas, d'autres facteurs (methode de travail, comprehension prealable...) interviennent aussi.</p>
  `
},
{
  title: "4. Le coefficient de correlation lineaire",
  html: `
    <p>Le <strong class="term" data-def="Le coefficient de correlation lineaire, note r, mesure a quel point deux variables sont liees par une relation lineaire, c'est-a-dire une droite. Il vaut toujours entre moins un et plus un.">coefficient de correlation lineaire</strong>, note <strong>r</strong>, mesure a quel point deux variables sont liees par une relation... lineaire (une droite).</p>
    <div class="callout formule">
      -1 &le; r &le; 1
    </div>
    <table class="data">
      <tr><th>Valeur de r</th><th>Interpretation</th></tr>
      <tr><td>proche de 1</td><td>correlation lineaire positive forte (quand x augmente, y augmente)</td></tr>
      <tr><td>proche de -1</td><td>correlation lineaire negative forte (quand x augmente, y diminue)</td></tr>
      <tr><td>proche de 0</td><td>quasi aucune correlation lineaire</td></tr>
    </table>
    <p>Pour notre exemple, le calcul donne r &asymp; 0,99 : une correlation lineaire positive tres forte, ce qui confirme qu'un ajustement lineaire est pertinent ici.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> r proche de 0 signifie qu'il n'y a pas de lien <em>lineaire</em>, mais il peut exister un lien d'un autre type (courbe, par exemple). r ne detecte que les liens lineaires.
    </div>
  `
},
{
  title: "5. Ajustement lineaire : methode de Mayer",
  html: `
    <p>La <strong class="term" data-def="La methode de Mayer est une methode simple pour tracer a la main une droite d'ajustement : on separe le nuage de points en deux groupes, on calcule leur point moyen, et on trace la droite qui les relie.">methode de Mayer</strong> est une methode simple (a la main) pour tracer une droite d'ajustement.</p>
    <ol class="clean">
      <li>Trier les points du nuage par abscisse x croissante.</li>
      <li>Partager le nuage en deux sous-groupes de tailles egales (ou presque).</li>
      <li>Calculer le point moyen de chaque sous-groupe (G1 et G2).</li>
      <li>Tracer la droite passant par G1 et G2 : c'est la droite de Mayer.</li>
    </ol>
    <p>Pour notre exemple : groupe 1 = {(1,45),(2,50),(3,55)}, point moyen G1(2 ; 50). Groupe 2 = {(4,65),(5,70),(6,80)}, point moyen G2(5 ; 71,67).</p>
    <div class="callout formule">
      Pente a = (71,67 - 50) / (5 - 2) &asymp; 7,22 <br>
      Droite de Mayer : y &asymp; 7,22x + 35,56
    </div>
  `
},
{
  title: "6. Ajustement lineaire : methode des moindres carres",
  html: `
    <p>La <strong class="term" data-def="La methode des moindres carres cherche la droite qui minimise la somme des carres des ecarts verticaux entre les points et la droite. C'est la methode la plus rigoureuse.">methode des moindres carres</strong> est plus rigoureuse : elle cherche la droite qui minimise la somme des carres des ecarts verticaux entre les points et la droite. Les formules ne sont pas a demontrer, mais a connaitre et utiliser.</p>
    <div class="callout formule">
      Droite de regression : y = ax + b<br>
      a = covariance(x,y) / variance(x)<br>
      b = y&#772; - a &times; x&#772;
    </div>
    <p>Pour notre exemple, le calcul donne a &asymp; 7,00 et b &asymp; 36,33, soit la droite <strong>y = 7x + 36,33</strong>. Remarque : cette droite passe exactement par le point moyen G(3,5 ; 60,83), puisque 7&times;3,5+36,33 = 60,83.</p>
    <div class="callout">
      On utilise ensuite cette equation pour estimer une valeur theorique : par exemple, pour x = 7 heures d'etude, la note estimee serait y = 7&times;7+36,33 = 85,33.
    </div>
    <div class="callout piege">
      <strong>Piege frequent :</strong> extrapoler tres loin en dehors des valeurs observees (par exemple x = 50 heures) est risque : rien ne garantit que la relation reste lineaire au-dela des donnees mesurees.
    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
