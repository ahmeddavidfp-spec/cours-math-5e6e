{

    <p>Un <strong class="term" data-def="Un vecteur est represente par un couple de nombres (ses composantes) et associe a une translation.">vecteur</strong> AB, associe a une translation, se represente par un couple de composantes (x, y).</p>

      Relation de Chasles : vecteur AB + vecteur BC = vecteur AC
    </div>
    <p><strong>Exemple :</strong> u = (3,4) et v = (1,2). u + v = (4,6). 2u = (6,8).</p>
  `
},
{
  title: "3. Alignement et parallelisme",
  html: `
    <p>Deux vecteurs non nuls sont <strong>paralleles</strong> (ou colineaires) si l'un est un multiple de l'autre : leurs composantes sont proportionnelles.</p>
    <p><strong>Exemple :</strong> A(1,1), B(3,5), C(5,9). Vecteur AB = (2,4), vecteur AC = (4,8) = 2 &times; AB. Les deux vecteurs sont paralleles et partagent le point A : les points A, B, C sont donc <strong>alignes</strong>.</p>
    <div class="callout">
      Pour demontrer que deux droites sont paralleles, il suffit de montrer que leurs vecteurs directeurs sont colineaires (composantes proportionnelles).
    </div>
  `
},
{
  title: "4. Produit scalaire",
  html: `
    <p>Le <strong class="term" data-def="Le produit scalaire de deux vecteurs u(x1,y1) et v(x2,y2) est le nombre x1*x2 + y1*y2 ; il vaut zero si et seulement si les vecteurs sont perpendiculaires.">produit scalaire</strong> de deux vecteurs u(x1,y1) et v(x2,y2) se calcule de deux facons equivalentes :</p>
    <div class="callout formule">
      u &middot; v = x1 &times; x2 + y1 &times; y2 (composantes)<br>
      u &middot; v = |u| &times; |v| &times; cos(&alpha;) (norme et angle entre les vecteurs)
    </div>
    <p><strong>Exemple :</strong> u = (3,4), v = (1,2). u&middot;v = 3&times;1 + 4&times;2 = 3+8 = 11. Comme |u| = 5 et |v| = &radic;5, on peut retrouver l'angle : cos(&alpha;) = 11 / (5&times;&radic;5) &asymp; 0,984, donc &alpha; &asymp; 10,3&deg;.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> le produit scalaire est un <strong>nombre</strong> (un scalaire), pas un vecteur. Deux vecteurs sont perpendiculaires si et seulement si leur produit scalaire vaut 0.
    </div>
  `
},
{

    <p>Cette approche vectorielle du produit scalaire prepare directement les vecteurs de l'espace (6e annee), ou les memes formules se generalisent avec trois composantes au lieu de deux.</p>
