{

    <p>Le module 6 t'a appris a calculer une probabilite ponctuelle. Ce module etudie des <strong class="term" data-def="Une variable aleatoire, c'est un nombre dont la valeur depend du resultat d'une experience aleatoire : par exemple, le gain a un jeu de hasard.">variables aleatoires</strong> completes, avec leur distribution, leur esperance et leur ecart-type, a travers trois lois de reference.</p>

      </ul>
    </div>
  `
},
{
  title: "2. Esperance mathematique et ecart-type",
  html: `
    <p>Pour une variable aleatoire discrete X qui prend les valeurs x1, x2, ... avec les probabilites p1, p2, ..., on definit :</p>
    <div class="callout formule">
      <strong class="term" data-def="L'esperance mathematique d'une variable aleatoire, c'est la moyenne de ses valeurs possibles, ponderee par leurs probabilites : c'est le gain moyen auquel on peut s'attendre a long terme.">Esperance</strong> : E(X) = somme de chaque valeur fois sa probabilite<br>
      <strong class="term" data-def="L'ecart-type d'une variable aleatoire mesure la dispersion de ses valeurs autour de l'esperance : plus il est grand, plus les resultats sont variables d'une experience a l'autre.">Ecart-type</strong> : racine carree de [E(X squared) - E(X) au carre]
    </div>
    <p><strong>Exemple :</strong> un jeu rapporte 10&euro; avec une probabilite de 0,2, rien avec une probabilite de 0,5, et fait perdre 5&euro; avec une probabilite de 0,3.</p>
    <div class="callout formule">
      E(X) = 10&times;0,2 + 0&times;0,5 + (-5)&times;0,3 = 2 + 0 - 1,5 = 0,5&euro;<br>
      Ecart-type &asymp; 5,22&euro;
    </div>
    <p>En moyenne, sur un grand nombre de parties, ce jeu rapporte 0,50&euro; par partie, mais avec une grande variabilite (ecart-type de plus de 5&euro;) d'une partie a l'autre.</p>
  `
},
{
  title: "3. La loi uniforme",
  html: `
    <p>Une variable aleatoire suit une <strong class="term" data-def="Une loi uniforme, c'est une distribution de probabilite ou toutes les valeurs possibles ont exactement la meme probabilite : le lancer d'un de non biaise en est l'exemple le plus simple.">loi uniforme</strong> quand toutes ses valeurs possibles ont la meme probabilite.</p>

      Ecart-type &asymp; 1,71
    </div>
    <p>Remarque : l'esperance (3,5) n'est pas une valeur que le de peut effectivement prendre ; c'est une moyenne theorique sur un tres grand nombre de lancers.</p>
  `
},
{
  title: "4. La loi binomiale",
  html: `
    <p>Une <strong class="term" data-def="Une epreuve de Bernoulli, c'est une experience aleatoire qui n'a que deux issues possibles : succes ou echec.">epreuve de Bernoulli</strong> n'a que deux issues : succes (probabilite p) ou echec (probabilite 1-p). Quand on repete n fois la meme epreuve de Bernoulli de maniere independante, le nombre total de succes suit une <strong class="term" data-def="Une loi binomiale decrit le nombre de succes obtenus en repetant n fois, de maniere independante, une meme epreuve qui n'a que deux issues possibles.">loi binomiale</strong>.</p>
    <div class="callout formule">
      P(X = k) = C(n,k) &times; p&#7509; &times; (1-p)&#8319;&#8315;&#7509;<br>
      E(X) = n &times; p<br>
      Ecart-type = &radic;[n &times; p &times; (1-p)]
    </div>
    <p><strong>Exemple :</strong> on lance une piece de monnaie equilibree 10 fois (n=10, p=0,5). Le nombre de "Face" obtenus suit une loi binomiale.</p>
    <div class="callout formule">
      E(X) = 10 &times; 0,5 = 5<br>

    </div>
  `
},
{
  title: "5. La loi normale",

    <p>La <strong class="term" data-def="Une loi normale, aussi appelee courbe de Gauss, decrit une variable aleatoire continue dont les valeurs se repartissent symetriquement autour de sa moyenne, en forme de cloche.">loi normale</strong> (courbe de Gauss) decrit des variables continues (tailles, notes, mesures physiques) reparties symetriquement autour de leur moyenne <strong>&mu;</strong>, avec un ecart-type <strong>&sigma;</strong>.</p>
    <div class="callout">
      Plus &sigma; est petit, plus la courbe est resserree autour de &mu; ; plus &sigma; est grand, plus la courbe est etalee.
    </div>
    <p>Pour calculer une probabilite avec la loi normale, on utilise une table qui donne P(Z &lt; z) pour la loi normale centree reduite (&mu;=0, &sigma;=1).</p>
    <table class="data">
      <caption>Extrait d'une table de la loi normale centree reduite</caption>
      <tr><th>z</th><td>-1</td><td>0</td><td>1</td><td>1,5</td><td>2</td></tr>

    </table>
    <p><strong>Exemple :</strong> les notes d'un examen suivent une loi normale de moyenne &mu;=100 et d'ecart-type &sigma;=15. Quelle est la probabilite d'obtenir moins de 115 ?</p>

      z = (115 - 100) / 15 = 1<br>
      P(X &lt; 115) = P(Z &lt; 1) = 0,8413 (lu dans la table)
    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
