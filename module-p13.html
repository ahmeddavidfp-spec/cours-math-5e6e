{
  title: "1. Objectifs de ce module",
  html: `
    <p>Dernier module de remise a niveau (4e annee) : le traitement numerique de donnees a une seule variable, base de la statistique a deux variables etudiee en 5e annee.</p>

        <li>calculer les <strong class="term" data-def="Les parametres de dispersion (etendue, ecart type...) mesurent a quel point les valeurs d'une serie sont dispersees autour de leur valeur centrale.">parametres de dispersion</strong> : etendue, variance, ecart type ;</li>

      </ul>
    </div>
  `
},
{
  title: "2. Valeurs centrales : mode, moyenne, mediane",
  html: `
    <p><strong>Exemple :</strong> notes sur 20 obtenues par 10 eleves a un test : 8, 10, 10, 12, 14, 14, 14, 16, 18, 20.</p>
    <div class="callout formule">
      Mode = la valeur la plus frequente<br>
      Moyenne = somme des valeurs / nombre de valeurs<br>
      Mediane = la valeur du milieu (serie ordonnee), ou la moyenne des deux valeurs centrales si le nombre de donnees est pair
    </div>
    <p>Pour cette serie : le <strong class="term" data-def="Le mode est la valeur qui apparait le plus souvent dans une serie de donnees.">mode</strong> est 14 (il apparait 3 fois). La <strong class="term" data-def="La moyenne d'une serie est la somme de toutes les valeurs divisee par le nombre de valeurs.">moyenne</strong> vaut (8+10+10+12+14+14+14+16+18+20)/10 = 136/10 = 13,6. La serie a 10 valeurs (nombre pair) deja ordonnees, donc la <strong class="term" data-def="La mediane d'une serie ordonnee est la valeur du milieu : autant de valeurs sont inferieures que superieures a elle.">mediane</strong> est la moyenne des 5e et 6e valeurs : (14+14)/2 = 14.</p>
  `
},
{
  title: "3. Parametres de dispersion",
  html: `
    <p>Les <strong class="term" data-def="Les parametres de dispersion (etendue, ecart type...) mesurent a quel point les valeurs d'une serie sont dispersees autour de leur valeur centrale.">parametres de dispersion</strong> indiquent si les valeurs sont regroupees autour de la moyenne ou au contraire dispersees.</p>
    <div class="callout formule">
      Etendue = valeur maximale - valeur minimale<br>
      Variance = moyenne des carres des ecarts a la moyenne<br>
      Ecart type = racine carree de la variance
    </div>

      <strong>Piege frequent :</strong> deux series peuvent avoir la meme moyenne mais des ecarts types tres differents : la moyenne seule ne dit rien sur la dispersion des donnees.
    </div>
  `
},
{
  title: "4. Effet d'un changement d'origine ou d'unite",

    <p>Si on transforme chaque donnee x en y = x + k (changement d'origine) ou en y = k&times;x (changement d'unite), la moyenne et l'ecart type se transforment de facon previsible.</p>
    <div class="callout formule">
      y = x + k : nouvelle moyenne = ancienne moyenne + k ; ecart type inchange<br>
      y = k &times; x : nouvelle moyenne = k &times; ancienne moyenne ; nouvel ecart type = |k| &times; ancien ecart type
    </div>
