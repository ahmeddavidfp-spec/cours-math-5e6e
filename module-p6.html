const theorySlides = [
{
  title: "1. Objectifs de ce module",
  html: `
    <p>Ce module reprend la trigonometrie du triangle rectangle (programme de 3e annee), derniere brique avant d'aborder la trigonometrie du cercle en 4e annee et les fonctions trigonometriques en 5e.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>definir le <strong class="term" data-def="Dans un triangle rectangle, le cosinus d'un angle aigu est le rapport entre le cote adjacent a cet angle et l'hypotenuse.">cosinus</strong>, le <strong class="term" data-def="Dans un triangle rectangle, le sinus d'un angle aigu est le rapport entre le cote oppose a cet angle et l'hypotenuse.">sinus</strong> et la <strong class="term" data-def="Dans un triangle rectangle, la tangente d'un angle aigu est le rapport entre le cote oppose et le cote adjacent a cet angle.">tangente</strong> d'un angle aigu ;</li>
        <li>utiliser la calculatrice pour passer d'un angle a un nombre trigonometrique et reciproquement ;</li>
        <li>connaitre les valeurs remarquables a 30&deg;, 45&deg; et 60&deg; ;</li>
        <li>resoudre des problemes de distances inaccessibles.</li>
      </ul>
    </div>
  `
},
{
  title: "2. Definitions dans le triangle rectangle",
  html: `
    <p>Dans un triangle rectangle, pour un angle aigu &alpha; :</p>
    <div class="callout formule">
      cos &alpha; = cote adjacent / hypotenuse<br>
      sin &alpha; = cote oppose / hypotenuse<br>
      tg &alpha; = cote oppose / cote adjacent
    </div>
    <p><strong>Exemple :</strong> triangle rectangle d'hypotenuse 10 et d'angle aigu 30&deg;. Le cote oppose a cet angle vaut 10 &times; sin(30&deg;) = 10 &times; 0,5 = 5. Le cote adjacent vaut 10 &times; cos(30&deg;) = 10 &times; 0,866 &asymp; 8,66.</p>
  `
},
{
  title: "3. Formules fondamentales",
  html: `
    <div class="callout formule">
      sin&sup2; &alpha; + cos&sup2; &alpha; = 1<br>
      tg &alpha; = sin &alpha; / cos &alpha;
    </div>
    <p><strong>Verification :</strong> pour &alpha; = 30&deg;, sin&sup2;(30&deg;) + cos&sup2;(30&deg;) = 0,25 + 0,75 = 1. Ces relations, deduites de Pythagore, permettent de retrouver un nombre trigonometrique a partir d'un autre, sans repasser par les longueurs du triangle.</p>
  `
},
{
  title: "4. Valeurs remarquables : 30deg, 45deg, 60deg",
  html: `
    <p>Les nombres trigonometriques de 45&deg; se deduisent d'un demi-carre ; ceux de 30&deg; et 60&deg;, d'un demi-triangle equilateral.</p>
    <table class="data">
      <tr><th>Angle</th><th>sin</th><th>cos</th><th>tg</th></tr>
      <tr><td>30&deg;</td><td>1/2 = 0,5</td><td>&radic;3/2 &asymp; 0,866</td><td>&radic;3/3 &asymp; 0,577</td></tr>
      <tr><td>45&deg;</td><td>&radic;2/2 &asymp; 0,707</td><td>&radic;2/2 &asymp; 0,707</td><td>1</td></tr>
      <tr><td>60&deg;</td><td>&radic;3/2 &asymp; 0,866</td><td>1/2 = 0,5</td><td>&radic;3 &asymp; 1,732</td></tr>
    </table>
    <p>On remarque que sin(30&deg;) = cos(60&deg;) et sin(60&deg;) = cos(30&deg;) : ces deux angles sont complementaires (leur somme vaut 90&deg;).</p>
  `
},
{
  title: "5. Applications : pentes et distances inaccessibles",
  html: `
    <p>La pente d'une route, exprimee en %, est le rapport entre la difference d'altitude et la progression horizontale correspondante ; c'est exactement la tangente de l'angle d'inclinaison, exprimee en pourcentage.</p>
    <p><strong>Exemple :</strong> une route monte de 15 m sur 100 m de progression horizontale. Sa pente est 15/100 = 15 %, ce qui correspond a un angle d'environ 8,5&deg; (arctangente de 0,15).</p>
    <p><strong>Distance inaccessible :</strong> depuis un point situe a 20 m du pied d'un arbre, le sommet est vu sous un angle de 35&deg; par rapport a l'horizontale. La hauteur de l'arbre vaut h = 20 &times; tg(35&deg;) &asymp; 20 &times; 0,700 &asymp; 14,0 m.</p>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];

  {front:"Formule fondamentale", back:"sin^2(alpha) + cos^2(alpha) = 1."},
  {front:"sin(45deg) et cos(45deg)", back:"Les deux valent racine(2)/2, environ 0,707."},
  {front:"tg(45deg)", back:"1."},
