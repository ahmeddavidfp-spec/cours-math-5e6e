{
  title: "2. La fonction exponentielle",
  html: `
    <p>Une <strong class="term" data-def="Une fonction exponentielle de base a s'ecrit x vers a puissance x : elle est croissante si a est superieur a 1, et decroissante si a est compris entre 0 et 1.">fonction exponentielle</strong> de base a (avec a &gt; 0 et a &ne; 1) s'ecrit x &rarr; a&#7509;. Son taux de croissance est constant sur des intervalles de longueur constante, exactement comme une suite geometrique.</p>
    <div class="callout formule">
      Si a &gt; 1 : la fonction est croissante (ex : 2&#7509;).<br>
      Si 0 &lt; a &lt; 1 : la fonction est decroissante (ex : 0,5&#7509;).
    </div>
    <p><strong>Exemple :</strong> f(x) = 2&#7509;. f(3) = 8, f(0) = 1, f(-1) = 0,5.</p>
    <p>La base la plus utilisee en mathematiques est le <strong class="term" data-def="Le nombre e, environ 2,71828, est la base de l'exponentielle naturelle : c'est la seule base pour laquelle la fonction exponentielle est egale a sa propre derivee.">nombre e</strong> (environ 2,71828), qui donne la fonction exponentielle de reference x &rarr; e&#7509;.</p>
  `
},
{
  title: "3. La fonction logarithme",
  html: `
    <p>La <strong class="term" data-def="Une fonction logarithme de base a est la fonction reciproque de l'exponentielle de base a : elle repond a la question, par quelle puissance faut-il elever a pour obtenir x.">fonction logarithme</strong> de base a, notee log base a, est la reciproque de l'exponentielle de base a : log base a de x repond a la question "par quelle puissance faut-il elever a pour obtenir x ?".</p>

      log base 10 de 100 = 2, car 10&sup2; = 100<br>
      log base 10 de 1000 = 3, car 10&sup3; = 1000<br>

    </div>
    <p>Le logarithme de base e s'appelle le <strong class="term" data-def="Le logarithme naturel, note ln, est le logarithme de base e : il repond a la question, par quelle puissance faut-il elever e pour obtenir x.">logarithme naturel</strong>, note ln. Par exemple, ln(e) = 1, car e&sup1; = e.</p>
    <div class="callout">
      La <strong class="term" data-def="La relation de reciprocite entre exponentielle et logarithme signifie que l'une annule l'autre : le logarithme d'une exponentielle redonne l'exposant de depart, et inversement.">relation de reciprocite</strong> : le graphique de log base a est le symetrique du graphique de a puissance x, par rapport a la droite y=x.
    </div>
  `
},
{
  title: "4. Proprietes des logarithmes",
  html: `
    <p>Les logarithmes transforment des multiplications en additions, ce qui les rend tres utiles pour resoudre certains problemes.</p>
    <div class="callout formule">
      log(a &times; b) = log(a) + log(b)<br>
      log(a / b) = log(a) - log(b)<br>
      log(a puissance n) = n &times; log(a)<br>
      Changement de base : log base b de x = ln(x) / ln(b)
    </div>
    <p><strong>Exemple :</strong> log(8) = log(2&sup3;) = 3 &times; log(2) &asymp; 3 &times; 0,301 = 0,903, ce qui correspond bien a la valeur calculee directement.</p>
  `
},
{
  title: "5. Resoudre des equations exponentielles et logarithmiques",
  html: `
    <p>Pour resoudre une equation ou l'inconnue est en exposant, on utilise le logarithme des deux membres. Pour resoudre une equation avec un logarithme, on utilise l'exponentielle des deux membres.</p>
    <div class="callout formule">
      Resoudre 3&#7509; = 81 : on remarque 81 = 3&#8308;, donc x = 4.<br>
      Resoudre ln(x) = 2 : on applique l'exponentielle des deux membres, x = e&sup2; &asymp; 7,389.
    </div>
    <p><strong>Application concrete (rappel du module 2) :</strong> apres combien d'annees un capital place a 5% d'interets composes double-t-il ? On resout (1,05)&#8319; = 2.</p>

{

    <p><strong>Exemple :</strong> f(x) = e&#7509;. f'(2) = e&sup2; &asymp; 7,389 (la valeur de la fonction et de sa derivee sont toujours egales, pour n'importe quel x).</p>

  `
}
