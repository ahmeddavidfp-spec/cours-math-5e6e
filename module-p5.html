{
  title: "2. Angles particuliers",
  html: `
    <div class="callout formule">
      Angle au centre = 2 &times; angle inscrit interceptant le meme arc.<br>
      Angles a cotes paralleles : egaux si de meme sens, supplementaires (somme = 180 deg) si de sens contraires.<br>
      Angles a cotes perpendiculaires : la meme regle s'applique.
    </div>
    <p><strong>Exemple :</strong> un angle inscrit vaut 35&deg;. L'angle au centre qui intercepte le meme arc vaut 2&times;35&deg; = 70&deg;. Inversement, un angle au centre de 100&deg; correspond a un angle inscrit de 50&deg;.</p>
  `
},
{
  title: "3. Triangle rectangle inscrit dans un demi-cercle",
  html: `
    <p>Un triangle est rectangle si et seulement si il est inscrit dans un demi-cercle dont le diametre est son hypotenuse : le sommet de l'angle droit se trouve sur le cercle de diametre l'hypotenuse.</p>
    <p>De maniere equivalente, la mediane relative a l'hypotenuse d'un triangle rectangle mesure exactement la moitie de l'hypotenuse.</p>
    <p><strong>Exemple :</strong> un triangle rectangle a une hypotenuse de 10 cm. Sa mediane relative a l'hypotenuse mesure 10/2 = 5 cm.</p>
  `
},
{
  title: "4. Isometrie des triangles",
  html: `
    <p>Deux figures sont <strong class="term" data-def="Deux figures sont isometriques si elles sont superposables : on passe de l'une a l'autre par une ou plusieurs translations, rotations ou symetries, sans changer les longueurs ni les angles.">isometriques</strong> si elles sont superposables. Pour prouver que deux triangles sont isometriques, trois cas suffisent :</p>
    <table class="data">
      <tr><th>Cas</th><th>Donnees minimales</th></tr>
      <tr><td>CCC</td><td>Les trois cotes egaux deux a deux.</td></tr>
      <tr><td>CAC</td><td>Deux cotes egaux et l'angle qu'ils forment (l'angle compris) egal.</td></tr>
      <tr><td>ACA</td><td>Deux angles egaux et le cote compris entre eux egal.</td></tr>
    </table>
    <div class="callout piege">
      <strong>Piege frequent :</strong> deux triangles ayant deux cotes egaux et un angle egal qui n'est PAS l'angle compris entre ces deux cotes ne sont pas forcement isometriques : l'angle doit etre celui forme par les deux cotes donnes.
    </div>
  `
},
{
  title: "5. Similitude des triangles",
  html: `
    <p>Deux figures sont <strong class="term" data-def="Deux figures sont semblables si elles ont la meme forme : leurs angles correspondants sont egaux et leurs cotes correspondants sont proportionnels.">semblables</strong> si elles ont la meme forme, sans forcement la meme taille : leurs angles correspondants sont egaux et leurs cotes correspondants sont proportionnels (meme rapport, dit <strong>rapport de similitude</strong>).</p>
    <p>Pour prouver que deux triangles sont semblables, il suffit de montrer que deux de leurs angles sont egaux deux a deux (cas AA), ou que leurs trois cotes sont proportionnels.</p>
    <div class="callout formule">
      Si le rapport de similitude est k :<br>
      rapport des perimetres = k<br>
      rapport des aires = k&sup2;
    </div>
    <p><strong>Exemple :</strong> un triangle rectangle de cotes 3, 4, 5 (perimetre 12, aire 6) est agrandi avec un rapport k=2, donnant un triangle de cotes 6, 8, 10. Son perimetre est 24 (rapport 2) et son aire est 24 (rapport 4 = 2&sup2;).</p>

}
