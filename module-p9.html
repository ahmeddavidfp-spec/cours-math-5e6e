    </div>

},
{
  title: "2. Graphique : sommet et axe de symetrie",
  html: `
    <p>Le graphique de f(x) = ax&sup2;+bx+c (a &ne; 0) est une <strong>parabole</strong>. Elle est tournee vers le haut si a &gt; 0, vers le bas si a &lt; 0.</p>
    <div class="callout formule">
      Abscisse du sommet : x_s = -b / (2a)<br>
      Axe de symetrie : la droite verticale x = x_s
    </div>
    <p><strong>Exemple :</strong> f(x) = x&sup2; - 5x + 6. Le sommet a pour abscisse x_s = -(-5)/(2&times;1) = 2,5. Son ordonnee vaut f(2,5) = 6,25 - 12,5 + 6 = -0,25. Le sommet est donc (2,5 ; -0,25), et c'est un minimum car a = 1 &gt; 0.</p>
  `
},
{
  title: "3. Resolution de l'equation du deuxieme degre",
  html: `
    <p>Pour resoudre ax&sup2;+bx+c = 0 (a &ne; 0), on calcule le <strong class="term" data-def="Le discriminant d'une equation du deuxieme degre ax^2+bx+c=0 vaut b^2-4ac : son signe indique le nombre de solutions reelles.">discriminant</strong> &Delta; = b&sup2; - 4ac.</p>
    <div class="callout formule">
      Si &Delta; &gt; 0 : deux solutions, x = (-b &plusmn; &radic;&Delta;) / (2a)<br>
      Si &Delta; = 0 : une solution (double), x = -b / (2a)<br>
      Si &Delta; &lt; 0 : aucune solution reelle
    </div>
    <p><strong>Exemple :</strong> x&sup2; - 5x + 6 = 0. &Delta; = 25 - 24 = 1 &gt; 0. Les solutions sont x = (5&plusmn;1)/2, soit x = 3 et x = 2.</p>
    <p><strong>Produit et somme des racines</strong> (utiles pour verifier) : somme = -b/a = 5, produit = c/a = 6. On verifie : 2+3=5 et 2&times;3=6, correct.</p>
  `
},
{
  title: "4. Factorisation d'un trinome",
  html: `
    <p>Des qu'on connait les racines x1 et x2 (ou une seule racine double), on peut factoriser directement :</p>
    <div class="callout formule">
      ax&sup2;+bx+c = a(x - x1)(x - x2)
    </div>
    <p><strong>Exemple :</strong> x&sup2; - 5x + 6, de racines 2 et 3, se factorise en (x-2)(x-3). Verification : (x-2)(x-3) = x&sup2;-3x-2x+6 = x&sup2;-5x+6.</p>
  `
},
{
  title: "5. Inequations du deuxieme degre",
  html: `
    <p>Pour resoudre ax&sup2;+bx+c &gt; 0 (ou &lt; 0), on etudie le signe du trinome a l'aide de ses racines : entre les racines, le trinome a le signe oppose a a ; a l'exterieur des racines, il a le meme signe que a.</p>
    <p><strong>Exemple :</strong> x&sup2; - 5x + 6 &gt; 0, avec a=1&gt;0 et racines 2 et 3. Le trinome est negatif entre 2 et 3, et positif a l'exterieur. La solution est donc x &lt; 2 ou x &gt; 3.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> si &Delta; &lt; 0, le trinome garde le signe de a pour <strong>tout</strong> x (pas de racine reelle pour changer de signe). Exemple : x&sup2;+x+1 (&Delta;=1-4=-3&lt;0) est toujours strictement positif, car a=1&gt;0.
    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];
