{
  title: "2. Theoreme de Pythagore",
  html: `
    <p>Dans un triangle rectangle, si c est la longueur de l'<strong>hypotenuse</strong> (le cote oppose a l'angle droit) et a, b les longueurs des deux autres cotes :</p>
    <div class="callout formule">
      c&sup2; = a&sup2; + b&sup2;
    </div>
    <p><strong>Exemple :</strong> triangle rectangle de cotes 3 et 4. L'hypotenuse vaut c = &radic;(3&sup2;+4&sup2;) = &radic;25 = 5 (le celebre triplet 3-4-5).</p>
    <p>La <strong>reciproque</strong> permet de verifier si un triangle est rectangle : si le carre du plus grand cote est egal a la somme des carres des deux autres, le triangle est rectangle.</p>
    <table class="data">
      <tr><th>Application</th><th>Formule</th><th>Exemple</th></tr>
      <tr><td>Diagonale d'un carre de cote a</td><td>d = a&radic;2</td><td>cote 6 &rarr; d = 6&radic;2 &asymp; 8,49</td></tr>
      <tr><td>Hauteur d'un triangle equilateral de cote a</td><td>h = a&radic;3 / 2</td><td>cote 10 &rarr; h = 5&radic;3 &asymp; 8,66</td></tr>
      <tr><td>Distance entre A(x1,y1) et B(x2,y2)</td><td>d = &radic;((x2-x1)&sup2;+(y2-y1)&sup2;)</td><td>A(1,2), B(4,6) &rarr; d = &radic;(3&sup2;+4&sup2;) = 5</td></tr>

    </table>
  `

  html: `
    <p>Un nombre irrationnel comme &radic;50 n'a pas d'ecriture decimale exacte : on peut l'<strong>encadrer</strong>. Comme 7&sup2;=49 et 8&sup2;=64, on sait que 7 &lt; &radic;50 &lt; 8 (plus precisement &radic;50 &asymp; 7,07).</p>
    <div class="callout formule">
      &radic;(a &times; b) = &radic;a &times; &radic;b (pour a, b &ge; 0)<br>

    <p><strong>Verification :</strong> &radic;16 &times; &radic;9 = 4 &times; 3 = 12, et &radic;(16&times;9) = &radic;144 = 12. Les deux methodes donnent le meme resultat.</p>

{
  title: "4. Configurations de Thales",
  html: `
    <p>Une <strong class="term" data-def="Une configuration de Thales est une figure (triangle, ou faisceau de droites paralleles coupe par deux secantes) ou des segments correspondants sont proportionnels.">configuration de Thales</strong> se rencontre dans deux cas : un triangle avec une droite parallele a l'un des cotes, ou un faisceau de droites paralleles coupe par deux secantes.</p>
    <p><strong>Exemple (triangle) :</strong> dans un triangle ABC, D est sur [AB] et E sur [AC], avec DE parallele a BC. Si AD = 3, AB = 8 et AC = 12, alors AD/AB = AE/AC, donc AE = (3/8)&times;12 = 4,5. Si de plus BC = 10, alors DE/BC = AD/AB, donc DE = (3/8)&times;10 = 3,75.</p>
    <p><strong>Exemple (faisceau) :</strong> trois droites paralleles coupent deux secantes. Sur la premiere secante, les segments interceptes mesurent 2 et 3 ; sur la seconde, le premier segment mesure 4. Le second segment x verifie 4/2 = x/3, donc x = 6.</p>
  `
},
{

    </div>

    <p><strong>Autre application frequente :</strong> les coordonnees du milieu M d'un segment [AB], avec A(x1,y1) et B(x2,y2), sont M = ((x1+x2)/2, (y1+y2)/2). Pour A(2,3) et B(8,11) : M = (5, 7).</p>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
