{
  title: "2. Vocabulaire et probabilite d'un evenement",
  html: `
    <p>Une <strong class="term" data-def="Une experience aleatoire, c'est une experience dont on ne peut pas prevoir le resultat a l'avance, meme si on connait tous les resultats possibles.">experience aleatoire</strong> est une experience dont le resultat depend du hasard (lancer un de, tirer une carte). Un <strong class="term" data-def="Un evenement, c'est un ensemble de resultats possibles d'une experience aleatoire.">evenement</strong> est un ensemble de resultats possibles.</p>
    <div class="callout formule">
      Probabilite d'un evenement A (cas equiprobables) : P(A) = nombre de cas favorables / nombre de cas possibles
    </div>
    <p><strong>Exemple :</strong> lancer un de a 6 faces, A = "obtenir un nombre pair" = {2, 4, 6}. P(A) = 3/6 = 0,5.</p>
    <div class="callout">
      <strong>Proprietes des probabilites :</strong> 0 &le; P(A) &le; 1 pour tout evenement A ; P(evenement certain) = 1 ; P(evenement impossible) = 0 ; P(A ou B) = P(A) + P(B) - P(A et B).
    </div>
    <p><strong>Exemple (union) :</strong> dans une classe de 30 eleves, 18 aiment les maths, 15 aiment le sport, 8 aiment les deux. P(aime maths ou sport) = (18 + 15 - 8) / 30 = 25/30 &asymp; 0,833.</p>
  `
},
{
  title: "3. Outils de denombrement : arbre et tableau",
  html: `
    <p>Un <strong>diagramme en arbre</strong> ou un <strong>tableau a double entree</strong> permettent de lister systematiquement tous les resultats possibles d'une experience a plusieurs etapes, sans en oublier.</p>
    <div class="callout">
      <strong>Exemple :</strong> on lance une piece de monnaie puis un de. L'arbre a deux branches (Pile, Face) qui se separent chacune en 6 branches (1 a 6) : il y a donc 2 &times; 6 = 12 resultats possibles au total. P(Face et nombre pair) = 1/2 &times; 1/2 = 1/4 (les deux etapes sont independantes).
    </div>
    <p>Ces outils sont particulierement utiles pour calculer une probabilite conditionnelle, car chaque branche de l'arbre peut porter une probabilite qui depend de ce qui s'est deja passe.</p>
  `
},
{
  title: "4. Analyse combinatoire",
  html: `
    <p>Quand denombrer a la main devient trop long, on utilise des formules de <strong>denombrement</strong>. Le choix de la formule depend de deux questions : y a-t-il repetition possible, et l'ordre compte-t-il ?</p>
    <table class="data">
      <tr><th>Situation</th><th>Formule</th><th>Exemple</th></tr>
      <tr><td><strong class="term" data-def="Une permutation, c'est le nombre de facons differentes de ranger tous les elements d'un ensemble dans un ordre : il y en a n factorielle pour n elements.">Permutation</strong> de n elements (ordre compte, sans repetition)</td><td>n!</td><td>Ranger 3 livres differents sur une etagere : 3! = 6 facons.</td></tr>
      <tr><td><strong class="term" data-def="Un arrangement, c'est le nombre de facons de choisir et ranger p elements parmi n, sans repetition, quand l'ordre compte.">Arrangement</strong> de p parmi n (ordre compte, sans repetition)</td><td>n! / (n-p)!</td><td>Tierce dans l'ordre parmi 8 chevaux : 8&times;7&times;6 = 336 facons.</td></tr>
      <tr><td>Arrangement avec repetition</td><td>n puissance p</td><td>Code a 4 chiffres (0 a 9, repetitions possibles) : 10 puissance 4 = 10 000 codes.</td></tr>
      <tr><td><strong class="term" data-def="Une combinaison, c'est le nombre de facons de choisir p elements parmi n, sans les ranger dans un ordre particulier.">Combinaison</strong> de p parmi n (ordre ne compte pas, sans repetition)</td><td>n! / (p! &times; (n-p)!)</td><td>Choisir 2 delegues parmi 5 eleves : 5!/(2!&times;3!) = 10 facons.</td></tr>
    </table>
    <div class="callout piege">

    </div>
  `
},
{
  title: "5. Probabilite conditionnelle et independance",
  html: `
    <p>La <strong class="term" data-def="Une probabilite conditionnelle, notee P de A sachant B, c'est la probabilite qu'un evenement A se realise, sachant qu'un autre evenement B s'est deja realise.">probabilite conditionnelle</strong> de A sachant B, notee P(A | B), est la probabilite que A se realise sachant que B s'est deja realise.</p>
    <p><strong>Exemple :</strong> un sac contient 3 boules rouges et 2 boules vertes. On tire 2 boules <strong>sans remise</strong>.</p>
    <div class="callout formule">
      P(2e rouge | 1re rouge) = 2/4 = 0,5 (il ne reste que 2 rouges parmi 4 boules apres le premier tirage)
    </div>
    <p>Si le tirage se faisait <strong>avec remise</strong> (on remet la boule avant de retirer), la probabilite de tirer rouge au 2e tirage resterait 3/5 = 0,6, quel que soit le resultat du premier tirage.</p>
    <div class="callout formule">
      Deux evenements A et B sont <strong class="term" data-def="Deux evenements sont independants quand la realisation de l'un ne change pas la probabilite de l'autre : P de A sachant B est alors egal a P de A tout court.">independants</strong> si P(A | B) = P(A), c'est-a-dire si le fait que B se realise ne change rien a la probabilite de A.
    </div>
    <p>Dans notre exemple : le tirage sans remise rend les deux tirages <strong>dependants</strong> (0,5 &ne; 0,6), tandis que le tirage avec remise les rend <strong>independants</strong> (toujours 0,6).</p>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
