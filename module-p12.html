{
  title: "2. La mediatrice d'un segment",
  html: `
    <p>La <strong class="term" data-def="La mediatrice d'un segment est l'ensemble des points equidistants des deux extremites de ce segment ; c'est une droite perpendiculaire au segment en son milieu.">mediatrice</strong> d'un segment [AB] est le lieu des points equidistants de A et de B : une droite perpendiculaire a [AB] passant par son milieu.</p>
    <p><strong>Exemple :</strong> A(1,2) et B(5,6). Le milieu de [AB] est (3,4). Le coefficient angulaire de AB est (6-2)/(5-1) = 1, donc celui de la mediatrice (perpendiculaire) est -1. L'equation de la mediatrice est y - 4 = -1(x - 3), soit y = -x + 7.</p>
  `

  title: "3. Le cercle",
  html: `
    <p>Le <strong>cercle</strong> de centre C(a,b) et de rayon r est le lieu des points a distance r de C.</p>
    <div class="callout formule">
      (x - a)&sup2; + (y - b)&sup2; = r&sup2;
    </div>
    <p><strong>Exemple :</strong> cercle de centre (2,3) et de rayon 5 : (x-2)&sup2; + (y-3)&sup2; = 25. Le point (5,7) appartient-il a ce cercle ? (5-2)&sup2;+(7-3)&sup2; = 9+16 = 25 : oui, il appartient au cercle.</p>
  `

  title: "4. La parabole (foyer et directrice)",
  html: `
    <p>Une <strong class="term" data-def="Une parabole de foyer F et de directrice d est l'ensemble des points equidistants de F et de d.">parabole</strong> de foyer F et de directrice d (une droite) est le lieu des points equidistants de F et de d.</p>
    <p><strong>Exemple :</strong> foyer F(0,2), directrice d : y = -2. Un point (x,y) de la parabole verifie : distance a F = distance a d, soit &radic;(x&sup2;+(y-2)&sup2;) = |y+2|. En elevant au carre et en simplifiant, on obtient x&sup2; = 8y, soit y = x&sup2;/8.</p>
    <p><strong>Verification :</strong> le point (4,2) est sur la parabole car 4&sup2;/8 = 2. Sa distance au foyer F(0,2) vaut &radic;((4-0)&sup2;+(2-2)&sup2;) = 4. Sa distance a la directrice y=-2 vaut |2-(-2)| = 4. Les deux distances sont bien egales.</p>
