{

  html: `
    <p>Ce module reprend le calcul avec les puissances et les <strong class="term" data-def="Un polynome est une expression algebrique formee d'une somme de termes contenant des puissances entieres d'une variable, chacun multiplie par un coefficient.">polynomes</strong> (programme de 3e annee) : des outils de manipulation algebrique indispensables partout ailleurs.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>utiliser les proprietes des puissances a exposants entiers ;</li>
        <li>calculer le degre, la somme et le produit de deux polynomes, et leur valeur numerique ;</li>
        <li>factoriser une expression par mise en evidence ou par <strong class="term" data-def="Les produits remarquables sont des egalites toujours vraies qui permettent de developper ou de factoriser rapidement certaines expressions : (a+b)^2, (a-b)^2, et (a+b)(a-b) = a^2-b^2.">produit remarquable</strong> ;</li>
        <li>appliquer la <strong class="term" data-def="La loi du reste dit que le reste de la division d'un polynome P(x) par (x-a) est egal a P(a), la valeur du polynome en a.">loi du reste</strong> pour diviser un polynome par (x - a) et simplifier une fraction algebrique.</li>
      </ul>
    </div>

},
{
  title: "2. Puissances a exposants entiers",
  html: `
    <div class="callout formule">
      a^m &times; a^n = a^(m+n)<br>
      (a^m)^n = a^(m&times;n)<br>
      a^-n = 1 / a^n (pour a &ne; 0)<br>
      a^0 = 1 (pour a &ne; 0)
    </div>
    <p><strong>Exemples :</strong> 2&sup3; &times; 2&#8308; = 2&#8311; = 128. (3&sup2;)&sup3; = 3&#8310; = 729. 5&#8315;&sup2; = 1/25 = 0,04. 7&#8304; = 1.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> un exposant negatif ne rend pas le nombre negatif : il indique un inverse. 5&#8315;&sup2; = 1/25, pas -25.
    </div>
  `
},
{
  title: "3. Polynomes : degre, somme, produit, valeur numerique",
  html: `
    <p>Le <strong>degre</strong> d'un <strong class="term" data-def="Un polynome est une expression algebrique formee d'une somme de termes contenant des puissances entieres d'une variable, chacun multiplie par un coefficient.">polynome</strong> est la plus haute puissance de la variable qui apparait, avec un coefficient non nul.</p>
    <p><strong>Exemple :</strong> P(x) = 2x&sup2; - 3x + 5 est de degre 2. Sa valeur numerique en x = 2 vaut P(2) = 2&times;4 - 3&times;2 + 5 = 8 - 6 + 5 = 7.</p>
    <p><strong>Produit de deux polynomes :</strong> (x + 3)(x - 2) = x&sup2; - 2x + 3x - 6 = x&sup2; + x - 6. On developpe terme a terme puis on reduit les termes semblables.</p>
  `
},
{
  title: "4. Mise en evidence et produits remarquables",
  html: `
    <p>La <strong>mise en evidence</strong> consiste a sortir un facteur commun a tous les termes.</p>
    <p><strong>Exemple :</strong> 4x&sup2; + 8x = 4x(x + 2).</p>
    <div class="callout formule">
      Produits remarquables :<br>
      (a + b)&sup2; = a&sup2; + 2ab + b&sup2;<br>
      (a - b)&sup2; = a&sup2; - 2ab + b&sup2;<br>
      (a + b)(a - b) = a&sup2; - b&sup2;
    </div>
    <p><strong>Exemples de factorisation :</strong> x&sup2; - 9 = (x-3)(x+3) &nbsp;&middot;&nbsp; x&sup2; + 6x + 9 = (x+3)&sup2; &nbsp;&middot;&nbsp; x&sup2; - 8x + 16 = (x-4)&sup2;.</p>
  `
},
{
  title: "5. Division de polynomes et loi du reste",
  html: `
    <p>Diviser un polynome par un polynome fonctionne comme la division des naturels : on cherche un quotient et il peut rester un reste.</p>
    <p>La <strong class="term" data-def="La loi du reste dit que le reste de la division d'un polynome P(x) par (x-a) est egal a P(a), la valeur du polynome en a.">loi du reste</strong> dit que le reste de la division de P(x) par (x - a) vaut P(a). En particulier, si P(a) = 0, alors (x - a) est un facteur de P(x) : cela permet de factoriser rapidement.</p>
    <p><strong>Exemple :</strong> P(x) = x&sup3; - 2x&sup2; - 5x + 6. On teste x = 1 : P(1) = 1 - 2 - 5 + 6 = 0. Donc (x - 1) est un facteur. En divisant, on obtient P(x) = (x - 1)(x&sup2; - x - 6) = (x - 1)(x - 3)(x + 2).</p>
    <div class="callout">
      Cette loi sert aussi a simplifier une fraction algebrique : si le numerateur et le denominateur partagent un facteur (x - a), on peut le simplifier apres factorisation.
    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];
