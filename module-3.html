<script>
const theorySlides = [
{
  title: "1. Objectifs de ce module",
  html: `
    <p>Tu sais deja etudier une <strong class="term" data-def="Une fonction rationnelle, c'est une fonction qui s'ecrit comme le quotient de deux polynomes.">fonction rationnelle</strong> comme x fois 1/x en 4e annee. Ce module va plus loin : il te donne les outils pour predire precisement le comportement d'une fonction rationnelle aux bornes de son <strong class="term" data-def="Le domaine de definition d'une fonction rationnelle, c'est l'ensemble des reels sauf ceux qui annulent le denominateur.">domaine</strong>, et pour ecrire l'equation de ses asymptotes.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>determiner le domaine et les limites utiles d'une fonction rationnelle ;</li>
        <li>calculer une limite et l'interpreter graphiquement ;</li>
        <li>rechercher les equations des asymptotes horizontale, verticale et oblique d'une fonction rationnelle ;</li>
        <li>reconnaitre un cas d'indetermination et une discontinuite supprimable.</li>
      </ul>
    </div>
  `
},
{
  title: "2. Rappel : fonctions rationnelles et domaine",
  html: `
    <p>Une fonction rationnelle s'ecrit f(x) = N(x) / D(x), ou N et D sont des polynomes. Elle n'est pas definie la ou le denominateur s'annule.</p>
    <div class="callout formule">
      Exemple : f(x) = (2x + 1) / (x - 1). Le denominateur s'annule pour x = 1, donc le domaine de f est R \\ {1} (tous les reels sauf 1).
    </div>
    <p>Dans ce module, on se limite aux fonctions rationnelles pour tous les calculs de limites et d'asymptotes.</p>
  `
},
{
  title: "3. La notion de limite et l'asymptote horizontale",
  html: `
    <p>Une <strong class="term" data-def="Une limite decrit la valeur dont s'approche f de x quand x se rapproche d'une valeur donnee, ou quand x devient tres grand.">limite</strong> decrit ce dont s'approche f(x) quand x se rapproche d'une valeur (ou de l'infini). On note lim x tend vers a de f(x) = L.</p>
    <p>Reprenons f(x) = (2x + 1) / (x - 1) et observons ce qui se passe quand x devient tres grand.</p>
    <table class="data">
      <tr><th>x</th><td>10</td><td>100</td><td>1000</td></tr>
      <tr><th>f(x)</th><td>2,33</td><td>2,03</td><td>2,003</td></tr>
    </table>
    <p>Plus x est grand, plus f(x) se rapproche de 2. On ecrit : lim x&rarr;+&infin; f(x) = 2.</p>
    <div class="callout formule">
      Si lim x&rarr;+&infin; f(x) = L (un nombre fini), le graphique de f admet une <strong class="term" data-def="Une asymptote horizontale, c'est une droite horizontale dont le graphique d'une fonction se rapproche indefiniment quand x devient tres grand ou tres negatif.">asymptote horizontale</strong> d'equation y = L.
    </div>
    <p><strong>Astuce de calcul :</strong> pour une fonction rationnelle, la limite en +&infin; ou -&infin; se calcule en ne gardant que les termes de plus haut degre du numerateur et du denominateur. Ici : (2x)/(x) = 2.</p>
  `
},
{
  title: "4. Limite en un reel, asymptote verticale et indetermination",
  html: `
    <p>Etudions maintenant ce qui se passe pres de x = 1 (la valeur exclue du domaine) pour f(x) = (2x + 1) / (x - 1).</p>
    <table class="data">
      <tr><th>x</th><td>0,9</td><td>0,99</td><td>1,01</td><td>1,1</td></tr>
      <tr><th>f(x)</th><td>-28</td><td>-298</td><td>302</td><td>32</td></tr>
    </table>
    <p>A gauche de 1, f(x) devient tres negatif ; a droite de 1, f(x) devient tres positif.</p>
    <div class="callout formule">
      Si f(x) tend vers +&infin; ou -&infin; quand x se rapproche d'un reel a, le graphique de f admet une <strong class="term" data-def="Une asymptote verticale, c'est une droite verticale que le graphique d'une fonction se rapproche indefiniment sans jamais l'atteindre, pres d'une valeur exclue du domaine.">asymptote verticale</strong> d'equation x = a.
    </div>
    <p>Mais attention : une valeur exclue du domaine ne donne pas toujours une asymptote verticale ! Prenons g(x) = (x&sup2; - 4) / (x - 2). En remplacant x par 2 directement, on obtient 0/0 : c'est une <strong class="term" data-def="Une indetermination, c'est une expression comme 0 sur 0 qui ne donne pas directement la valeur d'une limite : il faut transformer l'expression, par exemple en factorisant, avant de conclure.">indetermination</strong>.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> une indetermination ne veut pas dire "pas de limite". Ici, on factorise : x&sup2; - 4 = (x-2)(x+2), donc g(x) = (x-2)(x+2)/(x-2) = x+2 pour x &ne; 2. Donc lim x&rarr;2 g(x) = 2+2 = 4. Le graphique de g a un simple "trou" en x=2 (une <strong class="term" data-def="Une discontinuite supprimable, c'est un point isole ou une fonction n'est pas definie, alors que sa limite existe et est finie : le graphique presente un simple trou, pas une asymptote.">discontinuite supprimable</strong>), pas une asymptote verticale.
    </div>
  `
},
{
  title: "5. Asymptote oblique",
  html: `
    <p>Parfois, la limite a l'infini n'est ni finie ni verticale : le graphique se rapproche d'une droite oblique. Prenons h(x) = (x&sup2; + 1) / x.</p>
    <p>On effectue la <strong>division euclidienne</strong> du numerateur par le denominateur : x&sup2; + 1 = x &times; x + 1. Donc :</p>
    <div class="callout formule">
      h(x) = (x&sup2; + 1) / x = x + 1/x
    </div>
    <p>Quand x devient tres grand, 1/x se rapproche de 0, donc h(x) se rapproche de x. Le graphique de h admet donc une <strong class="term" data-def="Une asymptote oblique, c'est une droite ni horizontale ni verticale dont le graphique d'une fonction se rapproche indefiniment quand x devient tres grand ou tres negatif. On la trouve par la division euclidienne du numerateur par le denominateur : le quotient donne l'equation de l'asymptote.">asymptote oblique</strong> d'equation y = x. Le domaine de h exclut x = 0, ou h admet aussi une asymptote verticale.</p>
    <table class="data">
      <tr><th>x</th><td>10</td><td>-10</td></tr>
      <tr><th>h(x)</th><td>10,1</td><td>-10,1</td></tr>
      <tr><th>Droite y = x</th><td>10</td><td>-10</td></tr>
    </table>
    <p>L'ecart entre h(x) et la droite y = x (soit 1/x) devient de plus en plus petit quand x s'eloigne de 0, ce qui confirme l'asymptote oblique.</p>
  `
},
{
  title: "6. Synthese : reconnaitre le type d'asymptote",
  html: `
    <p>Pour une fonction rationnelle f(x) = N(x)/D(x), le type d'asymptote a l'infini depend de la comparaison des degres de N et de D.</p>
    <table class="data">
      <tr><th>Comparaison des degres</th><th>Type d'asymptote en &plusmn;&infin;</th></tr>
      <tr><td>degre(N) = degre(D)</td><td>Horizontale (rapport des coefficients de plus haut degre)</td></tr>
      <tr><td>degre(N) = degre(D) + 1</td><td>Oblique (quotient de la division euclidienne)</td></tr>
      <tr><td>degre(N) &gt; degre(D) + 1</td><td>Ni l'une ni l'autre (hors programme de ce module)</td></tr>
    </table>
    <div class="callout">
      Une valeur qui annule le denominateur donne toujours soit une asymptote verticale (si le numerateur ne s'annule pas en meme temps), soit une discontinuite supprimable (si numerateur et denominateur s'annulent ensemble et se simplifient).
    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];

const flashcardBank = [

  {front:"Domaine d'une fonction rationnelle", back:"Tous les reels sauf ceux qui annulent le denominateur."},
  {front:"Indetermination 0/0", back:"Expression qui ne donne pas directement la limite : il faut factoriser et simplifier avant de conclure."},
  {front:"Discontinuite supprimable", back:"Un 'trou' dans le graphique ou la limite existe et est finie, mais la fonction n'est pas definie (pas une asymptote)."},
  {front:"Calcul rapide d'une limite a l'infini (fonctions rationnelles)", back:"Ne garder que les termes de plus haut degre du numerateur et du denominateur."},
  {front:"Methode pour trouver une asymptote oblique", back:"Division euclidienne du numerateur par le denominateur : le quotient donne l'equation de l'asymptote."},
  {front:"lim x tend vers +infini de (2x+1)/(x-1)", back:"2 (rapport des coefficients de x : 2/1)."}

    {left:"f(x) - (x+3) tend vers 0 quand x tend vers +infini", options:["Asymptote horizontale y=3","Asymptote oblique y=x+3","Asymptote verticale x=3"], correct:"Asymptote oblique y=x+3"},
    {left:"lim x tend vers 5 f(x) = 7, alors que 5 est hors domaine", options:["Asymptote verticale x=5","Discontinuite supprimable (pas d'asymptote)","Asymptote horizontale y=7"], correct:"Discontinuite supprimable (pas d'asymptote)"}

    modelAnswer:"Pour trouver une asymptote oblique, on effectue la division euclidienne du numerateur par le denominateur : on obtient un quotient (un polynome du premier degre) et un reste. La fonction s'ecrit alors comme la somme du quotient et d'une fraction ou le reste est divise par le denominateur original. Quand x devient tres grand ou tres negatif, cette fraction (reste sur denominateur) tend vers zero, car le denominateur devient beaucoup plus grand que le reste, qui est un nombre fixe. Le graphique de la fonction se rapproche donc de plus en plus de la droite representant le quotient : c'est l'equation de l'asymptote oblique."
