      </ul>
    </div>
  `
},
{
  title: "2. Equations du premier degre",
  html: `
    <p>Une <strong class="term" data-def="Une equation du premier degre a une inconnue peut s'ecrire sous la forme ax + b = 0 : elle a une seule solution si a est different de zero.">equation du premier degre</strong> a une inconnue se resout en isolant x, en utilisant les proprietes des egalites : on peut ajouter, soustraire, multiplier ou diviser (par un nombre non nul) les deux membres d'une egalite sans changer sa solution.</p>
    <p><strong>Exemple :</strong> 3x - 5 = 2x + 7. On regroupe les x d'un cote : 3x - 2x = 7 + 5, donc x = 12. Verification : 3&times;12-5 = 31 et 2&times;12+7 = 31.</p>
    <table class="data">
      <tr><th>Cas</th><th>Exemple</th><th>Interpretation</th></tr>
      <tr><td>Une seule solution</td><td>2x + 3 = 9 &rarr; x = 3</td><td>La droite y = ax+b coupe l'axe Ox en un seul point (son zero).</td></tr>
      <tr><td>Impossible</td><td>2x + 3 = 2x + 7 &rarr; 0 = 4</td><td>Aucune solution : contradiction apres simplification.</td></tr>
      <tr><td>Indeterminee</td><td>2x + 3 = 2x + 3 &rarr; 0 = 0</td><td>Vraie pour tout x : une infinite de solutions.</td></tr>
    </table>
  `
},
{
  title: "3. Resoudre un probleme par une equation",
  html: `
    <p>Methode : choisir l'inconnue, traduire l'enonce en equation, resoudre, puis verifier et interpreter la solution dans le contexte.</p>
    <p><strong>Exemple :</strong> Lea a 5 ans de plus que son frere. Dans 3 ans, la somme de leurs ages sera 35. Quel est l'age actuel du frere ?</p>
    <div class="callout formule">
      Soit x l'age actuel du frere (donc Lea a x + 5 ans).<br>
      Dans 3 ans : (x + 3) + (x + 5 + 3) = 35<br>
      2x + 11 = 35 &rarr; 2x = 24 &rarr; x = 12
    </div>
    <p>Le frere a donc <strong>12 ans</strong> aujourd'hui (et Lea, 17 ans). Verification : dans 3 ans, 15 + 20 = 35, correct.</p>
  `
},
{
  title: "4. Systemes de deux equations a deux inconnues",
  html: `
    <p>Un <strong class="term" data-def="Un systeme de deux equations a deux inconnues cherche un couple de nombres qui verifie les deux equations en meme temps ; graphiquement, c'est l'intersection de deux droites.">systeme de deux equations</strong> a deux inconnues cherche un couple (x, y) qui verifie les deux equations a la fois. On le resout par <strong>substitution</strong> (isoler une inconnue dans une equation, la remplacer dans l'autre) ou par <strong>combinaison</strong> (additionner ou soustraire les equations, eventuellement multipliees, pour eliminer une inconnue).</p>
    <p><strong>Exemple (combinaison) :</strong> 2x + y = 10 et x - y = 2. En additionnant les deux equations, le y disparait : 3x = 12, donc x = 4, puis y = 10 - 2&times;4 = 2. Verification dans la 2e equation : 4 - 2 = 2, correct.</p>
    <table class="data">
      <tr><th>Cas</th><th>Interpretation graphique</th></tr>
      <tr><td>Solution unique</td><td>Les deux droites se coupent en un seul point.</td></tr>
      <tr><td>Impossible</td><td>Les deux droites sont paralleles distinctes (ex : x+y=3 et x+y=5).</td></tr>
      <tr><td>Indetermine</td><td>Les deux equations decrivent la meme droite (ex : x+y=3 et 2x+2y=6).</td></tr>
    </table>
  `
},
{
  title: "5. Inequations du premier degre",
  html: `
    <p>Une <strong class="term" data-def="Une inequation compare une expression a une valeur avec un signe d'inegalite (plus petit, plus grand...) ; sa solution est en general un intervalle de nombres.">inequation</strong> se resout comme une equation, avec une regle essentielle en plus.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> quand on multiplie ou divise les deux membres d'une inegalite par un nombre <strong>negatif</strong>, il faut inverser le sens de l'inegalite.
    </div>
    <p><strong>Exemple :</strong> -2x + 4 &le; 10. On isole x : -2x &le; 6. En divisant par -2 (negatif), le sens s'inverse : x &ge; -3.</p>
    <p>Verification : pour x = -3, -2&times;(-3)+4 = 10 &le; 10, correct (limite). Pour x = 0 (qui verifie x&ge;-3), -2&times;0+4 = 4 &le; 10, correct. Pour x = -4 (qui NE verifie PAS x&ge;-3), -2&times;(-4)+4 = 12, qui n'est pas &le; 10 : coherent.</p>
    <p>Graphiquement, resoudre ax + b &gt; 0 revient a chercher les x pour lesquels la droite y = ax + b est <strong>au-dessus</strong> de l'axe Ox ; ax + b &lt; 0 correspond aux x ou elle est en-dessous.</p>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
];
