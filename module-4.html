const theorySlides = [
{
  title: "1. Objectifs de ce module",
  html: `
    <p>Ce module relie plusieurs notions que tu connais deja separement (pente d'une droite, taux d'accroissement constant des suites, limites) autour d'un seul outil : la <strong class="term" data-def="La derivee est un outil qui relie la tangente, le taux d'accroissement, la croissance et la concavite d'une fonction.">derivee</strong>.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>calculer un taux d'accroissement moyen et un nombre derive ;</li>
        <li>calculer la derivee d'une fonction (somme, produit, quotient) ;</li>
        <li>determiner l'equation de la tangente en un point d'un graphique ;</li>
        <li>relier le signe de la derivee premiere a la croissance, et celui de la derivee seconde a la concavite.</li>
      </ul>
    </div>
  `
},
{
  title: "2. Du taux d'accroissement moyen au nombre derive",
  html: `
    <p>Le <strong class="term" data-def="Le taux d'accroissement moyen d'une fonction entre deux points, c'est la variation de f divisee par la variation de x entre ces deux points : c'est aussi la pente de la droite qui relie les deux points du graphique.">taux d'accroissement moyen</strong> d'une fonction f entre deux valeurs a et b est : [f(b) - f(a)] / (b - a). C'est la pente de la droite qui relie les deux points du graphique.</p>
    <p>Si on rapproche b de a de plus en plus, ce taux moyen tend vers une limite : le <strong class="term" data-def="Le nombre derive de f en a, note f prime de a, c'est la limite du taux d'accroissement moyen quand les deux points se rapprochent l'un de l'autre : c'est la pente de la tangente au graphique en ce point.">nombre derive</strong> de f en a, note f'(a).</p>
    <div class="callout formule">
      f'(a) = lim h&rarr;0 de [f(a+h) - f(a)] / h
    </div>
    <p><strong>Exemple :</strong> f(x) = x&sup2;, calculons f'(1) avec h = 0,001 : [f(1,001) - f(1)] / 0,001 &asymp; 2,001. Plus h se rapproche de 0, plus ce taux se rapproche de 2. Donc f'(1) = 2.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> ce calcul donne, comme au module 3, une indetermination 0/0 (h au denominateur, mais h qui tend vers 0). Il faut d'abord simplifier algebriquement avant de faire tendre h vers 0.
    </div>
    <p><strong>Interpretation geometrique :</strong> f'(a) est la pente de la <strong class="term" data-def="La tangente au graphique d'une fonction en un point, c'est la droite qui touche le graphique en ce point avec exactement la meme pente que la fonction a cet endroit.">tangente</strong> au graphique de f au point d'abscisse a.</p>
  `
},
{
  title: "3. La fonction derivee et les regles de calcul",
  html: `
    <p>En repetant ce calcul pour chaque valeur de x, on obtient la <strong>fonction derivee</strong> f'. Pour les fonctions de reference de ce module (rationnelles et racines carrees) :</p>
    <div class="callout formule">
      (k)' = 0 (k constant)<br>
      (x&#8319;)' = n &times; x&#8319;&#8315;&sup1; (n entier)<br>
      (&radic;x)' = 1 / (2&radic;x)
    </div>
    <p>Pour combiner des fonctions, on utilise ces regles :</p>
    <div class="callout formule">
      Somme : (u + v)' = u' + v'<br>
      Produit : (u &times; v)' = u' &times; v + u &times; v'<br>
      Quotient : (u / v)' = (u' &times; v - u &times; v') / v&sup2;
    </div>
    <p><strong>Exemple (produit) :</strong> f(x) = x&radic;x. Avec u=x (u'=1) et v=&radic;x (v'=1/(2&radic;x)) : f'(x) = 1&times;&radic;x + x&times;1/(2&radic;x) = &radic;x + &radic;x/2 = (3/2)&radic;x. Verification a x=4 : f'(4) = 1,5 &times; 2 = 3.</p>
    <p><strong>Exemple (quotient) :</strong> f(x) = (x+1)/(x-1). Avec u=x+1 (u'=1) et v=x-1 (v'=1) : f'(x) = [1&times;(x-1) - (x+1)&times;1] / (x-1)&sup2; = -2/(x-1)&sup2;. A x=3 : f'(3) = -2/4 = -0,5.</p>
  `
},
{
  title: "4. La tangente en un point",
  html: `
    <p>Une fois f'(a) connu, l'equation de la tangente au graphique de f au point d'abscisse a s'ecrit :</p>
    <div class="callout formule">
      y - f(a) = f'(a) &times; (x - a)
    </div>
    <p><strong>Exemple :</strong> f(x) = x&sup2; - 4x + 3. Cherchons la tangente en x=0. On a f(0) = 3 et f'(x) = 2x - 4, donc f'(0) = -4.</p>
    <div class="callout formule">
      y - 3 = -4 &times; (x - 0), soit y = -4x + 3
    </div>
    <p>Verification : pour x = 0,01, la fonction vaut f(0,01) = 2,9601, tres proche de la tangente y = -4&times;0,01+3 = 2,96. Plus on est pres de x=0, plus la tangente colle au graphique.</p>
  `
},
{
  title: "5. Derivee premiere et croissance",
  html: `
    <p>Le signe de f' renseigne directement sur la croissance de f.</p>
    <div class="callout formule">
      f'(x) &gt; 0 sur un intervalle &rArr; f est croissante sur cet intervalle<br>
      f'(x) &lt; 0 sur un intervalle &rArr; f est decroissante sur cet intervalle<br>
      f'(a) = 0 et changement de signe autour de a &rArr; <strong class="term" data-def="Un extremum local, c'est un point ou une fonction passe de croissante a decroissante (maximum) ou de decroissante a croissante (minimum) : sa derivee premiere s'y annule et change de signe.">extremum local</strong> en a
    </div>
    <p><strong>Exemple :</strong> f(x) = x&sup2; - 4x + 3, f'(x) = 2x - 4. f'(x) = 0 pour x = 2. Pour x &lt; 2, f'(x) &lt; 0 (decroissante) ; pour x &gt; 2, f'(x) &gt; 0 (croissante). Donc x=2 est un minimum local, avec f(2) = -1.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> f'(a) = 0 ne suffit pas pour conclure a un extremum ! Exemple : f(x) = x&sup3;, alors f'(x) = 3x&sup2; &ge; 0 partout, donc f'(0) = 0 mais f est croissante avant ET apres x=0 (pas de changement de signe) : x=0 n'est pas un extremum.
    </div>
  `
},
{
  title: "6. Derivee seconde, concavite et point d'inflexion",
  html: `
    <p>La derivee seconde f'' (la derivee de la derivee) renseigne sur la <strong class="term" data-def="La concavite du graphique d'une fonction, c'est le sens de sa courbure : concave vers le haut si le graphique ressemble a une vallee, concave vers le bas si il ressemble a une colline.">concavite</strong> du graphique.</p>
    <div class="callout formule">
      f''(x) &gt; 0 &rArr; concavite vers le haut (comme une vallee)<br>
      f''(x) &lt; 0 &rArr; concavite vers le bas (comme une colline)<br>
      f''(a) = 0 et changement de signe autour de a &rArr; <strong class="term" data-def="Un point d'inflexion, c'est un point ou le graphique d'une fonction change de sens de concavite : la derivee seconde s'y annule et change de signe.">point d'inflexion</strong> en a
    </div>
    <p><strong>Exemple :</strong> g(x) = x&sup3; - 3x&sup2;. On calcule g'(x) = 3x&sup2; - 6x = 3x(x-2), qui s'annule en x=0 et x=2. On calcule g''(x) = 6x - 6, qui s'annule en x=1.</p>
    <table class="data">
      <tr><th>x</th><td>x &lt; 0</td><td>0</td><td>0 &lt; x &lt; 1</td><td>1</td><td>1 &lt; x &lt; 2</td><td>2</td><td>x &gt; 2</td></tr>
      <tr><th>g'(x)</th><td>+</td><td>0</td><td>-</td><td></td><td>-</td><td>0</td><td>+</td></tr>
      <tr><th>g''(x)</th><td>-</td><td></td><td>-</td><td>0</td><td>+</td><td></td><td>+</td></tr>

    </table>
    <p>Ce tableau (un <strong>tableau de variations</strong>) resume toute l'information utile pour esquisser le graphique de g, en combinant le signe de g' et celui de g''.</p>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
