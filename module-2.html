const theorySlides = [
{

  html: `
    <p>Une <strong class="term" data-def="Une suite, c'est une liste ordonnee de nombres, indexee par un rang n : u zero, u un, u deux, et ainsi de suite.">suite</strong> est une liste ordonnee de nombres, indexee par un rang n (u0, u1, u2, ...). Ce module etudie deux familles fondamentales de suites et leur application la plus concrete : les placements financiers.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>definir une suite par son rang ou par recurrence ;</li>
        <li>calculer le terme general et la somme des n premiers termes d'une suite arithmetique ou geometrique ;</li>

        <li>appliquer ces notions aux interets simples et aux interets composes.</li>
      </ul>
    </div>
  `
},
{
  title: "2. Definir une suite",
  html: `
    <p>Une suite peut se definir de deux manieres.</p>
    <table class="data">
      <tr><th>Definition en fonction du rang</th><th>Definition par recurrence</th></tr>
      <tr><td>Une formule directe donne u_n en fonction de n. Exemple : u_n = 3n + 2.</td><td>Chaque terme se calcule a partir du precedent. Exemple : u0 = 2, et u_(n+1) = u_n + 3.</td></tr>
    </table>
    <p>Ces deux definitions peuvent decrire la meme suite : ici, u0=2, u1=5, u2=8... correspond bien a u_n = 3n+2.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> selon les manuels, une suite peut commencer au rang 0 (u0) ou au rang 1 (u1). Verifie toujours a quel rang correspond le premier terme donne dans un enonce.
    </div>
  `
},
{
  title: "3. Suites arithmetiques",
  html: `
    <p>Une <strong class="term" data-def="Une suite arithmetique a un taux d'accroissement constant : on ajoute toujours le meme nombre, appele la raison, pour passer d'un terme au suivant.">suite arithmetique</strong> a un <strong class="term" data-def="Un taux d'accroissement constant signifie qu'on ajoute toujours le meme nombre pour passer d'un terme au suivant : c'est la caracteristique des suites arithmetiques.">taux d'accroissement constant</strong> : on ajoute toujours le meme nombre r (la raison) pour passer d'un terme au suivant.</p>
    <div class="callout formule">
      Terme general : u_n = u_0 + n &times; r<br>
      Somme des n premiers termes (u_0 a u_(n-1)) : S = n &times; (u_0 + u_(n-1)) / 2
    </div>
    <p><strong>Exemple :</strong> u_0 = 3, r = 4. Alors u_n = 3 + 4n. Donc u_5 = 3 + 4&times;5 = 23. La somme des 6 premiers termes (u_0 a u_5) vaut S = 6 &times; (3 + 23) / 2 = 6 &times; 13 = 78.</p>
    <div class="callout">
      Une suite arithmetique de raison positive est croissante et diverge vers +infini ; de raison negative, elle est decroissante et diverge vers -infini ; de raison nulle, elle est constante.
    </div>
  `
},
{
  title: "4. Suites geometriques",
  html: `
    <p>Une <strong class="term" data-def="Une suite geometrique a un taux de croissance constant : on multiplie toujours par le meme nombre, appele la raison, pour passer d'un terme au suivant.">suite geometrique</strong> a un <strong class="term" data-def="Un taux de croissance constant signifie qu'on multiplie toujours par le meme nombre pour passer d'un terme au suivant : c'est la caracteristique des suites geometriques.">taux de croissance constant</strong> : on multiplie toujours par le meme nombre q (la raison) pour passer d'un terme au suivant.</p>
    <div class="callout formule">
      Terme general : u_n = u_0 &times; q^n<br>
      Somme des n premiers termes (u_0 a u_(n-1), si q &ne; 1) : S = u_0 &times; (q^n - 1) / (q - 1)
    </div>
    <p><strong>Exemple :</strong> u_0 = 2, q = 3. Alors u_n = 2 &times; 3^n. Donc u_4 = 2 &times; 81 = 162. La somme des 5 premiers termes (u_0 a u_4) vaut S = 2 &times; (3^5 - 1)/(3-1) = 2 &times; 242/2 = 242.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> ne confonds pas taux d'accroissement constant (arithmetique, on ajoute) et taux de croissance constant (geometrique, on multiplie). Ce sont deux types de croissance tres differents, meme si les mots se ressemblent.
    </div>
    <p><strong>Convergence :</strong> si 0 &lt; q &lt; 1, la suite geometrique tend vers 0 (elle converge). Si q &gt; 1, elle diverge vers +infini. Si q = 1, elle est constante.</p>
  `
},
{
  title: "5. Interets simples et interets composes",
  html: `
    <p>Les interets simples suivent une croissance <strong>arithmetique</strong> ; les interets composes suivent une croissance <strong>geometrique</strong>.</p>

      Interets simples : C_n = C_0 &times; (1 + r &times; n)<br>
      Interets composes : C_n = C_0 &times; (1 + r)^n
    </div>

    <table class="data">
      <tr><th>Type</th><th>Calcul</th><th>Capital final</th></tr>
      <tr><td>Interets simples</td><td>1000 &times; (1 + 0,05 &times; 10)</td><td>1500&euro;</td></tr>

    </table>
    <div class="callout">

    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}
