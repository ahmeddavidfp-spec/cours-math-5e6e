{
  title: "4. Le theoreme fondamental",
  html: `
    <p>Le <strong>theoreme fondamental</strong> relie l'integrale definie a une primitive quelconque F de f :</p>

    </div>
    <p><strong>Exemple :</strong> calculons l'integrale de 0 a 2 de x&sup2; dx, l'aire evoquee au debut de ce module. Une primitive de x&sup2; est F(x) = x&sup3;/3.</p>

      Volume = &pi; &times; integrale de a a b de [f(x)]&sup2; dx
