{
  title: "2. Racines de x^2 = a",
  html: `
    <p>Pour a &ge; 0, l'equation x&sup2; = a a deux solutions (si a &gt; 0) : x = &radic;a et x = -&radic;a. Pour a &lt; 0, elle n'a aucune solution reelle (un carre est toujours &ge; 0).</p>
    <p><strong>Exemple :</strong> x&sup2; = 49 a pour solutions x = 7 et x = -7. x&sup2; = -4 n'a pas de solution reelle.</p>
  `
},
{
  title: "3. Radicaux d'indice n et puissances a exposants rationnels",
  html: `
    <p>Le <strong class="term" data-def="Un radical d'indice n, note racine n-ieme de a, est le nombre qui, eleve a la puissance n, redonne a.">radical d'indice n</strong> de a, note racine n-ieme de a, est le nombre qui, eleve a la puissance n, redonne a.</p>
    <div class="callout formule">
      a^(1/n) = racine n-ieme de a<br>
      a^(p/q) = racine q-ieme de (a^p) = (racine q-ieme de a)^p
    </div>
    <p><strong>Exemples :</strong> 27^(1/3) = racine cubique de 27 = 3 (car 3&sup3;=27). 8^(2/3) = (racine cubique de 8)&sup2; = 2&sup2; = 4. 16^(3/4) = (racine 4e de 16)&sup3; = 2&sup3; = 8.</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> a^(p/q) n'est defini pour a negatif que dans certains cas particuliers (q impair). En pratique, au 2e degre, on se limite le plus souvent a des bases positives.
    </div>
  `
},
{
  title: "4. Methode des coefficients indetermines",
  html: `
    <p>La <strong class="term" data-def="La methode des coefficients indetermines consiste a poser une expression algebrique avec des lettres inconnues, puis a utiliser des conditions donnees pour calculer ces lettres.">methode des coefficients indetermines</strong> consiste a poser une expression avec des lettres inconnues (les coefficients), puis a utiliser les conditions donnees par l'enonce pour former un systeme d'equations et calculer ces lettres.</p>
    <p><strong>Exemple :</strong> trouver &alpha;, &beta;, &gamma; tels que la courbe d'equation y = &alpha;x&sup2; + &beta;x + &gamma; passe par les points (0,1), (1,4) et (2,9).</p>
    <div class="callout formule">
      x=0 : &gamma; = 1<br>
      x=1 : &alpha; + &beta; + &gamma; = 4 &rArr; &alpha; + &beta; = 3<br>
      x=2 : 4&alpha; + 2&beta; + &gamma; = 9 &rArr; 2&alpha; + &beta; = 4<br>
      En soustrayant : &alpha; = 1, donc &beta; = 2
    </div>
    <p>La courbe cherchee est y = x&sup2; + 2x + 1, soit (x+1)&sup2;. Verification : en x=0, y=1 ; en x=1, y=4 ; en x=2, y=9. Correct.</p>

  `
}
